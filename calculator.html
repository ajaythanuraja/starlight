<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Calculator for Kids 🧮</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #171817;
        --muted: #686b67;
        --line: #d9d9d2;
        --paper: #fffdf5;
        --canvas: #e7e7e2;
        --green: #b7e532;
        --green-dark: #8eaf20;
        --green-wash: #eef7c9;
        --shadow: 0 16px 48px rgba(23, 24, 23, .12);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .card { width: min(420px, calc(100% - 40px)); padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
      .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--green); }
      .tagline { margin: 0 0 22px; color: var(--muted); font-size: 12px; }
      .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
      .op { min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 20px; font-weight: 750; transition: .15s ease; }
      .op:hover { border-color: var(--green-dark); }
      .op.active { border-color: var(--green); background: var(--green-wash); }
      input.num { width: 100%; height: 52px; padding: 0 14px; margin-bottom: 10px; outline: none; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 22px; font-weight: 700; text-align: center; }
      input.num:focus { border-color: var(--green-dark); box-shadow: 0 0 0 3px rgba(183,229,50,.25); }
      .calc-btn { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--green); color: var(--ink); font-size: 16px; font-weight: 750; transition: .15s ease; }
      .calc-btn:hover { background: var(--green-dark); }
      .calc-btn:disabled { opacity: .55; cursor: wait; }
      .result { margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--green-wash); text-align: center; font-size: 22px; font-weight: 800; letter-spacing: -.03em; min-height: 60px; display: grid; place-items: center; }
      .result.error { background: #fbe9e7; color: #b3391f; }
      .history { margin-top: 14px; max-height: 130px; overflow-y: auto; font-size: 12px; color: var(--muted); }
      .history div { padding: 4px 2px; border-bottom: 1px solid #edf0ed; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand"><span class="brand-mark">🧮</span> Math Calculator for Kids</div>
      <p class="tagline">Instant math practice — works offline! ⚡</p>

      <div class="ops">
        <button class="op active" data-op="add">+</button>
        <button class="op" data-op="subtract">−</button>
        <button class="op" data-op="multiply">×</button>
        <button class="op" data-op="divide">÷</button>
      </div>

      <input class="num" id="a" type="number" placeholder="First number" />
      <input class="num" id="b" type="number" placeholder="Second number" />
      <button class="calc-btn" id="go">Calculate</button>

      <div class="result" id="result">Pick two numbers! 😊</div>
      <div class="history" id="history"></div>
    </div>

    <script>
      let currentOp = "add";
      const symbols = { add: "+", subtract: "−", multiply: "×", divide: "÷" };

      // The calculator logic from note.py, rewritten in native JavaScript.
      const math = {
        add:      (a, b) => a + b,
        subtract: (a, b) => a - b,
        multiply: (a, b) => a * b,
        divide:   (a, b) => (b === 0 ? null : a / b),  // can't divide by zero!
      };

      function calculate() {
        const a = parseFloat(document.getElementById("a").value);
        const b = parseFloat(document.getElementById("b").value);
        const box = document.getElementById("result");

        if (isNaN(a) || isNaN(b)) {
          box.className = "result error";
          box.textContent = "Type both numbers first! 😊";
          return;
        }

        const out = math[currentOp](a, b);
        box.className = "result";

        if (out === null) {
          box.textContent = "We can't divide by zero! 🚫";
        } else {
          const nice = Number.isInteger(out) ? out : Math.round(out * 1000) / 1000;
          box.textContent = `${a} ${symbols[currentOp]} ${b} = ${nice} ✅`;
          addHistory(`${a} ${symbols[currentOp]} ${b} = ${nice}`);
        }
      }

      function addHistory(line) {
        const h = document.getElementById("history");
        const row = document.createElement("div");
        row.textContent = line;
        h.prepend(row);
      }

      document.querySelectorAll(".op").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelector(".op.active").classList.remove("active");
          btn.classList.add("active");
          currentOp = btn.dataset.op;
        });
      });

      document.getElementById("go").addEventListener("click", calculate);

      // Bonus: pressing Enter in a number box also calculates.
      document.querySelectorAll(".num").forEach(inp => {
        inp.addEventListener("keydown", e => { if (e.key === "Enter") calculate(); });
      });
    </script>
  </body>
</html>
